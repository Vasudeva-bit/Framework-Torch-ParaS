[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jax_paras_plugin"
version = "0.1.0"
description = "JAX PJRT C-API plugin for ParaS-Compiler + CLAP (v0.1 MatMul prototype)"
requires-python = ">=3.10"

[project.entry-points."jax_plugins"]
paras = "jax_paras_plugin"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
jax_paras_plugin = ["libpjrt_paras.so"]
